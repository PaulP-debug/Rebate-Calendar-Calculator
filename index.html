<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebate Calendar Calculator</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  input, select, textarea { display: block; margin-bottom: 10px; width: 300px; padding: 5px; }
  textarea { height: 150px; }
  button { padding: 10px 20px; font-size: 16px; border-radius: 4px; border: none; margin-right: 10px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  .valid-range { background-color: #c6efce; }
  #modeLabel { font-size: 18px; font-weight: bold; margin-top: 20px; }

  .flex-container { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .flex-child { flex: 1; min-width: 350px; }
  .result-container { max-height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 5px; margin-top: 10px; }

  .csat-box {
    border: 1px solid #ccc;
    padding: 15px;
    margin-top: 10px;
    background: #f9f9f9;
  }
  .csat-box h3 { margin-top: 0; }
  .csat-box input { width: 120px; }
</style>
</head>
<body>

<div id="appContainer">
  <h2>Rebate Calendar Calculator</h2>

  <div class="flex-container">
    <!-- LEFT -->
    <div class="flex-child">
      <label>Rebate Date</label>
      <input id="rebateDate">
      <label>Tier</label>
      <select id="tier">
        <option value="1">Tier 1 (5 days)</option>
        <option value="2">Tier 2 (7 days)</option>
        <option value="3">Tier 3 (9 days)</option>
      </select>
      <label>Purchase Dates</label>
      <textarea id="purchaseDates"></textarea>
      <button onclick="calculateAcorn()">Calculate (ACORN + LEGENDS)</button>
      <button onclick="calculateLegends()">Calculate (OLD_LEGENDS)</button>

      <div id="modeLabel"></div>
      <div class="result-container" id="result"></div>
    </div>

    <!-- RIGHT -->
    <div class="flex-child">
      <!-- CSAT CALCULATOR -->
      <div class="csat-box">
        <h3>CSAT Calculator</h3>

        <label>⭐ 5 Stars</label>
        <input type="number" id="csat5" min="0" value="0">

        <label>⭐ 4 Stars</label>
        <input type="number" id="csat4" min="0" value="0">

        <label>⭐ 3 Stars</label>
        <input type="number" id="csat3" min="0" value="0">

        <label>⭐ 2 Stars</label>
        <input type="number" id="csat2" min="0" value="0">

        <label>⭐ 1 Star</label>
        <input type="number" id="csat1" min="0" value="0">

        <button onclick="calculateCSAT()">Calculate CSAT</button>

        <p><strong>Average CSAT:</strong> <span id="csatAverage">-</span></p>
        <p><strong>5⭐ Needed for 4.0:</strong> <span id="csatNeeded">-</span></p>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- CSAT CALCULATOR ---------- */
function calculateCSAT() {
  const s5 = parseInt(document.getElementById("csat5").value) || 0;
  const s4 = parseInt(document.getElementById("csat4").value) || 0;
  const s3 = parseInt(document.getElementById("csat3").value) || 0;
  const s2 = parseInt(document.getElementById("csat2").value) || 0;
  const s1 = parseInt(document.getElementById("csat1").value) || 0;

  const totalTickets = s5 + s4 + s3 + s2 + s1;
  if (totalTickets === 0) {
    document.getElementById("csatAverage").textContent = "-";
    document.getElementById("csatNeeded").textContent = "-";
    return;
  }

  const totalScore = (5*s5) + (4*s4) + (3*s3) + (2*s2) + (1*s1);
  const average = totalScore / totalTickets;

  document.getElementById("csatAverage").textContent = average.toFixed(2);

  // Calculate additional 5★ needed to reach 4.0
  if (average >= 4.0) {
    document.getElementById("csatNeeded").textContent = "0";
    return;
  }

  let needed = 0;
  while ((totalScore + needed*5) / (totalTickets + needed) < 4.0) {
    needed++;
  }

  document.getElementById("csatNeeded").textContent = needed;
}
</script>

</body>
</html>
